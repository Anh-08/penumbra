<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" role="img" aria-labelledby="t d">
<title id="t">How Penumbra works</title>
<desc id="d">Loop diagram. Simulated power telemetry from satellites on real orbits reaches the ground only during a pass. Sense: detection and triage. Understand: a Gemini agent calls tools and a safety layer checks every command. Act: a Monte Carlo verifier tests every plan against every hypothesis. Plans that pass go to a flight rule or a human who approves the exact plan hash; plans that fail are refused. An uplink scheduler sends the command in a contact window. A strip at the bottom gives benchmark B4 timings measured offline.</desc>
<defs>
<style>
.bg{fill:#05080d}.frame{fill:none;stroke:#1e2a3a;stroke-width:1.5}
.box{fill:#0b111a;stroke:#2c3b50;stroke-width:1.5}
.lbl{font:700 13px Barlow,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.12em;fill:#74839a}
.h{font:700 20px Barlow,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#e9eff7}
.b{font:400 15px Barlow,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#a3b1c4}
.m{font:400 13.5px 'JetBrains Mono',SFMono-Regular,Consolas,'Liberation Mono',monospace;fill:#e9eff7}
.ms{font:400 12.5px 'JetBrains Mono',SFMono-Regular,Consolas,'Liberation Mono',monospace;fill:#a3b1c4}
.big{font:700 26px 'JetBrains Mono',SFMono-Regular,Consolas,'Liberation Mono',monospace;fill:#e9eff7}
.amber{fill:#ffb224}.green{fill:#35d49a}.red{fill:#ff5468}.ink{fill:#e9eff7}
.chip{font:700 14px Barlow,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.16em}
.flow{fill:none;stroke:#a3b1c4;stroke-width:2;stroke-dasharray:7 7;animation:march 1.2s linear infinite}
.flow.g{stroke:#35d49a}.flow.r{stroke:#ff5468}.flow.a{stroke:#ffb224}
@keyframes march{to{stroke-dashoffset:-28}}
.cell{fill:#121b27;stroke:#1e2a3a}
.cg{fill:#35d49a;opacity:0;animation:lit 7s infinite}
.cr{fill:#ff5468;opacity:0;animation:lit 7s infinite}
@keyframes lit{0%{opacity:0}6%{opacity:.85}82%{opacity:.85}90%{opacity:0}100%{opacity:0}}
.pulse{fill:none;stroke:#ffb224;stroke-width:2;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{stroke-opacity:.25}50%{stroke-opacity:1}}
.blink{animation:blink 2.4s steps(1) infinite}
@keyframes blink{0%{opacity:1}50%{opacity:.35}}
</style>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2" height="6" fill="#74839a"/></pattern>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#a3b1c4"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#35d49a"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#ff5468"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#ffb224"/></marker>
</defs>

<rect class="bg" width="1280" height="760" rx="16"/>
<rect class="frame" x="1" y="1" width="1278" height="758" rx="16"/>

<!-- header + legend -->
<text class="lbl" x="70" y="44">HOW PENUMBRA WORKS · ONE LOOP PER INCIDENT</text>
<line x1="930" y1="40" x2="962" y2="40" stroke="#e9eff7" stroke-width="2.5"/>
<text class="lbl" x="972" y="44" style="fill:#e9eff7">REAL</text>
<rect x="1050" y="33" width="32" height="13" fill="url(#hatch)"/>
<text class="lbl" x="1092" y="44" style="fill:#e9eff7">SIMULATED</text>

<!-- row A: space segment -->
<rect class="box" x="70" y="70" width="520" height="100" rx="4"/>
<rect x="70" y="70" width="8" height="100" fill="url(#hatch)"/>
<text class="lbl" x="94" y="96">POWER · 24 SATELLITES · SIMULATED</text>
<text class="h" x="94" y="124">Power system truth simulator</text>
<text class="b" x="94" y="150">seeded battery, solar arrays and loads, plus injected faults</text>

<rect class="box" x="710" y="70" width="530" height="100" rx="4"/>
<rect x="710" y="70" width="8" height="100" fill="#e9eff7"/>
<text class="lbl" x="734" y="96">GEOMETRY · REAL</text>
<text class="h" x="734" y="124">Orbits, eclipse and ground contacts</text>
<text class="b" x="734" y="150">Skyfield · public OMM elements · DE421 · penumbra model</text>

<path id="pA" class="flow" d="M710,120 L594,120" marker-end="url(#ar)"/>
<text class="ms" x="650" y="104" text-anchor="middle">eclipse</text>
<text class="ms" x="650" y="146" text-anchor="middle">drives power</text>

<!-- telemetry down -->
<path id="pB" class="flow" d="M240,170 L240,226" marker-end="url(#ar)"/>
<text class="ms" x="254" y="203">telemetry reaches the ground only during a pass</text>

<!-- row B: sense / understand / act -->
<rect class="box" x="70" y="230" width="340" height="170" rx="4"/>
<text class="chip amber" x="92" y="260">SENSE</text>
<text class="h" x="92" y="290">Detection and triage</text>
<text class="b" x="92" y="318">alerts ranked by time to critical</text>
<text class="b" x="92" y="342">countdown to each next pass (AOS)</text>
<text class="ms" x="92" y="380">backend/fleet</text>

<path id="pC" class="flow" d="M410,315 L446,315" marker-end="url(#ar)"/>

<rect class="box" x="450" y="230" width="395" height="170" rx="4"/>
<text class="chip ink" x="472" y="260">UNDERSTAND</text>
<text class="h" x="472" y="290">Gemini agent, function calling</text>
<text class="m" x="472" y="318">get_fleet_status → score_hypotheses</text>
<text class="m" x="472" y="338">→ propose_plan → simulate</text>
<text class="b" x="472" y="366">safety layer: allowlist, essential loads,</text>
<text class="b" x="472" y="386">contact window, plan hash</text>

<path id="pD" class="flow" d="M845,315 L881,315" marker-end="url(#ar)"/>

<rect class="box" x="885" y="230" width="355" height="170" rx="4"/>
<text class="chip green" x="907" y="260">ACT · VERIFY</text>
<text class="h" x="907" y="290">Monte Carlo verifier</text>
<text class="b" x="907" y="316">every plan × every hypothesis,</text>
<text class="b" x="907" y="338">through the next eclipse</text>
<!-- mini matrix: rows = hypotheses, cols = plans -->
<g transform="translate(907,352)">
 <text class="ms" x="0" y="11">H×P</text>
 <g transform="translate(40,0)">
  <rect class="cell" x="0" y="0" width="22" height="9"/><rect class="cell" x="26" y="0" width="22" height="9"/><rect class="cell" x="52" y="0" width="22" height="9"/>
  <rect class="cell" x="0" y="13" width="22" height="9"/><rect class="cell" x="26" y="13" width="22" height="9"/><rect class="cell" x="52" y="13" width="22" height="9"/>
  <rect class="cell" x="0" y="26" width="22" height="9"/><rect class="cell" x="26" y="26" width="22" height="9"/><rect class="cell" x="52" y="26" width="22" height="9"/>
  <rect class="cg" x="0" y="0" width="22" height="9" style="animation-delay:.2s"/><rect class="cg" x="0" y="13" width="22" height="9" style="animation-delay:.5s"/><rect class="cg" x="0" y="26" width="22" height="9" style="animation-delay:.8s"/>
  <rect class="cg" x="26" y="0" width="22" height="9" style="animation-delay:1.1s"/><rect class="cr" x="26" y="13" width="22" height="9" style="animation-delay:1.4s"/><rect class="cg" x="26" y="26" width="22" height="9" style="animation-delay:1.7s"/>
  <rect class="cg" x="52" y="0" width="22" height="9" style="animation-delay:2.0s"/><rect class="cg" x="52" y="13" width="22" height="9" style="animation-delay:2.3s"/><rect class="cg" x="52" y="26" width="22" height="9" style="animation-delay:2.6s"/>
 </g>
 <text class="ms" x="128" y="11">one red cell fails a plan</text>
 <text class="ms" x="128" y="29">none green → SAFE_MODE</text>
</g>

<!-- verifier to gates -->
<path id="pE" class="flow g" d="M960,400 L960,425 L645,425 L645,446" marker-end="url(#ag)"/>
<text class="ms green" x="975" y="420">passes every cause</text>
<path id="pF" class="flow r" d="M1165,400 L1165,446" marker-end="url(#arr)"/>
<text class="ms red" x="1155" y="436" text-anchor="end">fails one</text>

<!-- row C: scheduler / approval / veto -->
<rect class="box" x="70" y="450" width="340" height="86" rx="4"/>
<text class="chip ink" x="92" y="478">UPLINK SCHEDULER</text>
<text class="b" x="92" y="503">CP-SAT over real contact windows</text>
<text class="ms" x="92" y="524">backend/sched</text>

<rect class="box" x="450" y="450" width="395" height="86" rx="4"/>
<rect class="pulse" x="450" y="450" width="395" height="86" rx="4"/>
<text class="chip amber" x="472" y="478">FLIGHT RULE OR HUMAN</text>
<text class="b" x="472" y="503">Tier 1: a pre-approved flight rule executes</text>
<text class="b" x="472" y="525">Tier 2: a human approves the exact plan hash</text>

<path id="pG" class="flow a" d="M450,493 L414,493" marker-end="url(#aa)"/>

<rect class="box" x="885" y="450" width="355" height="86" rx="4" style="stroke:#ff5468"/>
<text class="chip red blink" x="907" y="478">PHYSICS VETO</text>
<text class="b" x="907" y="503">refused, for the AI and for humans</text>
<text class="b" x="907" y="525">nobody can approve a red plan</text>

<!-- uplink back to space -->
<path id="pH" class="flow" d="M70,493 L42,493 L42,120 L66,120" marker-end="url(#ar)"/>
<text class="ms" transform="translate(32,330) rotate(-90)" text-anchor="middle">command uplink, in a contact window</text>

<!-- moving packets -->
<g fill="#e9eff7">
 <circle r="4"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#pA"/></animateMotion></circle>
 <circle r="4"><animateMotion dur="1.2s" repeatCount="indefinite" begin=".3s"><mpath href="#pB"/></animateMotion></circle>
 <circle r="4"><animateMotion dur="1s" repeatCount="indefinite" begin=".6s"><mpath href="#pC"/></animateMotion></circle>
 <circle r="4"><animateMotion dur="1s" repeatCount="indefinite" begin=".9s"><mpath href="#pD"/></animateMotion></circle>
 <circle r="4" fill="#35d49a"><animateMotion dur="2.2s" repeatCount="indefinite" begin="1.2s"><mpath href="#pE"/></animateMotion></circle>
 <circle r="4" fill="#ff5468"><animateMotion dur="1.2s" repeatCount="indefinite" begin="1.5s"><mpath href="#pF"/></animateMotion></circle>
 <circle r="4" fill="#ffb224"><animateMotion dur="1s" repeatCount="indefinite" begin="1.8s"><mpath href="#pG"/></animateMotion></circle>
 <circle r="4"><animateMotion dur="3s" repeatCount="indefinite" begin="2.1s"><mpath href="#pH"/></animateMotion></circle>
</g>

<!-- row D: around the loop -->
<rect x="70" y="560" width="1170" height="46" rx="4" fill="#121b27"/>
<text class="lbl" x="92" y="588">AROUND THE LOOP</text>
<text class="b" x="270" y="589">FastAPI + WebSocket → Cesium globe · ElevenLabs voice callouts (cached) · flight recorder → paced replay</text>

<!-- row E: scale, measured offline (bench/results/b4*.json) -->
<text class="lbl" x="70" y="642">SCALE · BENCHMARK B4 · MEASURED OFFLINE · LAPTOP (22 CPUS) | VULTR VC2-2C-4GB (2 VCPUS)</text>
<g transform="translate(70,656)">
 <text class="ms" x="0" y="14">24 sats × 6 hyp × 3 plans × 20 MC, 3 h</text>
 <text class="big" x="0" y="48">49 ms <tspan class="ms" style="font-size:16px">|</tspan> 227 ms</text>
</g>
<g transform="translate(470,656)">
 <text class="ms" x="0" y="14">10,000 sats, same check (648 M evals)</text>
 <text class="big" x="0" y="48">29 s <tspan class="ms" style="font-size:16px">|</tspan> 84 s</text>
</g>
<g transform="translate(870,656)">
 <text class="ms" x="0" y="14">200 uplinks, 3 stations, CP-SAT optimal</text>
 <text class="big" x="0" y="48">0.28 s <tspan class="ms" style="font-size:16px">|</tspan> 1.5 s</text>
</g>
</svg>
